# Render Blueprint. Free-tier limits that matter here:
#   - 512 MB RAM per service, so the backend serves ONNX only (no PyTorch).
#   - Web services sleep after about 15 minutes idle; the first request after
#     that takes around a minute. Open the demo a minute early.
#   - The free Postgres has no persistent-disk guarantees and expires after
#     a limited period, so treat stored sessions as disposable.
services:
  - type: web
    name: screening-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: screening-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"

  - type: web
    name: screening-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_USE_MOCK_API
        value: "false"

databases:
  - name: screening-db
    plan: free
    databaseName: screening
    user: screening
