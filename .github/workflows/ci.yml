name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-train.txt
            backend/requirements.txt
      - name: Install CPU PyTorch first so pip does not pull the CUDA build
        run: pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install the training and backend stacks
        run: |
          grep -vE '^(grad-cam|ttach)' requirements-train.txt > train-no-gradcam.txt
          pip install -r train-no-gradcam.txt -r backend/requirements.txt
          pip install --no-deps grad-cam==1.5.4 ttach==0.0.3
      - run: ruff check .
      - run: mypy common training tremor backend tests
      - run: pytest -q

  backend-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install only the backend requirements (no PyTorch, no shap)
        run: pip install -r backend/requirements.txt
      - name: Backend tests pass without the training stack
        run: pytest -q tests/test_backend.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCK_API: "true"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -f backend/Dockerfile -t screening-backend .
      - name: Build the frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 -t screening-frontend frontend
