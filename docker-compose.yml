services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: screening
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screening-local-only}
      POSTGRES_DB: screening
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screening -d screening"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://screening:${POSTGRES_PASSWORD:-screening-local-only}@db:5432/screening
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCK_API: "false"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
